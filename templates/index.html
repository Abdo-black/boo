<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مركز التحميل</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            color: white;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, rgba(255, 0, 0, 0.25), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(120, 0, 0, 0.3), transparent 35%),
                linear-gradient(135deg, #080000, #250000, #500000, #080000);

            background-size: 200% 200%;
            animation: backgroundMove 12s ease-in-out infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* دوائر ضوئية في الخلفية */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.08);
            filter: blur(80px);
            pointer-events: none;
        }

        body::before {
            top: -120px;
            left: -100px;
        }

        body::after {
            bottom: -150px;
            right: -100px;
        }

        .container {
            position: relative;
            width: min(90%, 430px);
            padding: 55px 40px;

            text-align: center;

            background: rgba(10, 0, 0, 0.78);
            border: 1px solid rgba(255, 50, 50, 0.5);
            border-radius: 24px;

            box-shadow:
                0 0 40px rgba(255, 0, 0, 0.18),
                inset 0 0 30px rgba(255, 0, 0, 0.04);

            backdrop-filter: blur(12px);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            border: 2px solid #ff3333;

            font-size: 32px;

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.4);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 35px rgba(255, 0, 0, 0.65);
            }
        }

        h1 {
            margin: 0 0 12px;

            font-size: 30px;
            color: #ff3b3b;

            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.5);
        }

        .description {
            margin-bottom: 30px;
            color: #c9c9c9;
            font-size: 15px;
            line-height: 1.8;
        }

        .download-btn {
            display: inline-block;

            padding: 15px 45px;

            border: 1px solid #ff3333;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #8b0000,
                #d00000
            );

            color: white;
            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 8px 25px rgba(255, 0, 0, 0.25);

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                background 0.25s;
        }

        .download-btn:hover {
            transform: translateY(-3px);

            background: linear-gradient(
                135deg,
                #b00000,
                #ff0000
            );

            box-shadow:
                0 12px 35px rgba(255, 0, 0, 0.45);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            ↓
        </div>

        <h1>مركز التحميل</h1>

        <p class="description">
            الملف متاح للتحميل من الخادم المحلي.
        </p>

        <!-- مهم: نستخدم route الخاص بـ Flask -->
        <a href="{{ url_for('download') }}" class="download-btn">
            تحميل الملف
        </a>

        <div class="footer">
            127.0.0.1 • Local Server
        </div>

    </div>

</body>
</html>
